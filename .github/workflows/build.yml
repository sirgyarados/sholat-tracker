          cat << 'EOF' > app/src/main/java/id/sholattracker/SholatPrefs.kt
          package id.sholattracker

          import android.content.Context
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.time.LocalDate
          import java.time.LocalTime
          import java.time.YearMonth

          object SholatPrefs {
              private const val PREFS_NAME = "sholat_tracker_prefs"
              val PRAYER_NAMES = arrayOf("Subuh", "Dzuhur", "Ashar", "Maghrib", "Isya")
              val DEFAULT_TIMES = arrayOf("04:15", "11:50", "15:12", "17:58", "19:10")

              private fun prefs(context: Context) =
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)

              fun isPrayerDone(context: Context, date: LocalDate, index: Int): Boolean {
                  return prefs(context).getBoolean("done_${date}_$index", false)
              }

              fun togglePrayer(context: Context, date: LocalDate, index: Int): Boolean {
                  val current = isPrayerDone(context, date, index)
                  val next = !current
                  prefs(context).edit().putBoolean("done_${date}_$index", next).apply()
                  return next
              }

              fun getDayStatuses(context: Context, date: LocalDate): BooleanArray {
                  return BooleanArray(5) { idx -> isPrayerDone(context, date, idx) }
              }

              fun isFullDay(context: Context, date: LocalDate): Boolean {
                  for (i in 0..4) {
                      if (!isPrayerDone(context, date, i)) return false
                  }
                  return true
              }

              fun getCurrentStreak(context: Context): Int {
                  val today = LocalDate.now()
                  var streak = 0
                  var checkDate = if (isFullDay(context, today)) today else today.minusDays(1)
                  while (isFullDay(context, checkDate)) {
                      streak++
                      checkDate = checkDate.minusDays(1)
                  }
                  return streak
              }

              fun getMonthProgress(context: Context, ym: YearMonth): Pair<Int, Int> {
                  val today = LocalDate.now()
                  val maxDay = if (ym == YearMonth.from(today)) today.dayOfMonth else ym.lengthOfMonth()
                  var doneCount = 0
                  for (d in 1..maxDay) {
                      val date = ym.atDay(d)
                      for (i in 0..4) {
                          if (isPrayerDone(context, date, i)) doneCount++
                      }
                  }
                  return Pair(doneCount, maxDay * 5)
              }

              fun getScheduleForDate(context: Context, date: LocalDate): Array<String> {
                  val raw = prefs(context).getString("sched_$date", null) ?: return DEFAULT_TIMES
                  val parts = raw.split(",")
                  return if (parts.size == 5) parts.toTypedArray() else DEFAULT_TIMES
              }

              fun saveScheduleForDate(context: Context, dateStr: String, times: Array<String>) {
                  prefs(context).edit().putString("sched_$dateStr", times.joinToString(",")).apply()
              }

              fun hasScheduleForMonth(context: Context, ym: YearMonth): Boolean {
                  val firstDay = ym.atDay(1)
                  return prefs(context).contains("sched_$firstDay")
              }

              fun getCityName(context: Context): String {
                  return prefs(context).getString("city_name", "Kota Tangerang Selatan") ?: "Kota Tangerang Selatan"
              }

              fun getCityId(context: Context): String {
                  return prefs(context).getString("city_id", "1108") ?: "1108"
              }

              fun saveCity(context: Context, cityId: String, cityName: String) {
                  prefs(context).edit()
                      .putString("city_id", cityId)
                      .putString("city_name", cityName)
                      .apply()
              }

              fun getActivePrayerIndex(times: Array<String>): Int {
                  return try {
                      val now = LocalTime.now()
                      val parsed = times.map {
                          val p = it.trim().split(":")
                          LocalTime.of(p[0].toInt(), p[1].toInt())
                      }
                      when {
                          now.isBefore(parsed[0]) -> 0
                          now.isBefore(parsed[1]) -> 0
                          now.isBefore(parsed[2]) -> 1
                          now.isBefore(parsed[3]) -> 2
                          now.isBefore(parsed[4]) -> 3
                          else -> 4
                      }
                  } catch (e: Exception) {
                      0
                  }
              }

              fun syncKemenagSchedule(context: Context, rawCityQuery: String?, ym: YearMonth): Boolean {
                  return try {
                      var cityId = getCityId(context)
                      var cityName = getCityName(context)

                      if (!rawCityQuery.isNullOrBlank()) {
                          val cleanQuery = rawCityQuery
                              .replace("Kota Administrasi", "", ignoreCase = true)
                              .replace("Kabupaten", "", ignoreCase = true)
                              .replace("Kota", "", ignoreCase = true)
                              .replace("South Tangerang", "Tangerang Selatan", ignoreCase = true)
                              .replace("Jakarta", "Jakarta", ignoreCase = true)
                              .trim()

                          if (cleanQuery.isNotEmpty()) {
                              val encoded = URLEncoder.encode(cleanQuery, "UTF-8")
                              val searchJson = httpGet("https://api.myquran.com/v2/sholat/kota/cari/$encoded")
                              if (searchJson != null) {
                                  val root = JSONObject(searchJson)
                                  if (root.optBoolean("status", false)) {
                                      val dataArr = root.optJSONArray("data")
                                      if (dataArr != null && dataArr.length() > 0) {
                                          val first = dataArr.getJSONObject(0)
                                          cityId = first.getString("id")
                                          cityName = first.getString("lokasi")
                                          saveCity(context, cityId, cityName)
                                      }
                                  }
                              }
                          }
                      }

                      val monthStr = String.format("%02d", ym.monthValue)
                      val schedUrl = "https://api.myquran.com/v2/sholat/jadwal/$cityId/${ym.year}/$monthStr"
                      val schedJson = httpGet(schedUrl) ?: return false
                      val root = JSONObject(schedJson)
                      if (!root.optBoolean("status", false)) return false

                      val dataObj = root.getJSONObject("data")
                      val lokasi = dataObj.optString("lokasi", cityName)
                      saveCity(context, cityId, lokasi)

                      val jadwalArr = dataObj.getJSONArray("jadwal")
                      for (i in 0 until jadwalArr.length()) {
                          val item = jadwalArr.getJSONObject(i)
                          val dateStr = item.getString("date")
                          val times = arrayOf(
                              item.getString("subuh"),
                              item.getString("dzuhur"),
                              item.getString("ashar"),
                              item.getString("maghrib"),
                              item.getString("isya")
                          )
                          saveScheduleForDate(context, dateStr, times)
                      }
                      true
                  } catch (e: Exception) {
                      false
                  }
              }

              private fun httpGet(urlStr: String): String? {
                  val conn = URL(urlStr).openConnection() as HttpURLConnection
                  return try {
                      conn.requestMethod = "GET"
                      conn.connectTimeout = 8000
                      conn.readTimeout = 8000
                      if (conn.responseCode == 200) {
                          conn.inputStream.bufferedReader().use { it.readText() }
                      } else null
                  } catch (e: Exception) {
                      null
                  } finally {
                      conn.disconnect()
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/id/sholattracker/SholatWidget.kt
          package id.sholattracker

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.widget.RemoteViews
          import java.time.LocalDate
          import java.time.YearMonth
          import kotlin.concurrent.thread

          class SholatWidget : AppWidgetProvider() {

              override fun onUpdate(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetIds: IntArray
              ) {
                  updateAllWidgets(context)
                  val ym = YearMonth.now()
                  if (!SholatPrefs.hasScheduleForMonth(context, ym)) {
                      thread {
                          if (SholatPrefs.syncKemenagSchedule(context, null, ym)) {
                              updateAllWidgets(context)
                          }
                      }
                  }
              }

              override fun onReceive(context: Context, intent: Intent) {
                  super.onReceive(context, intent)
                  if (intent.action == ACTION_TOGGLE_PRAYER) {
                      val index = intent.getIntExtra(EXTRA_PRAYER_INDEX, -1)
                      if (index in 0..4) {
                          SholatPrefs.togglePrayer(context, LocalDate.now(), index)
                          updateAllWidgets(context)
                      }
                  }
              }

              companion object {
                  const val ACTION_TOGGLE_PRAYER = "id.sholattracker.ACTION_TOGGLE_PRAYER"
                  const val EXTRA_PRAYER_INDEX = "extra_prayer_index"

                  private val BOX_IDS = intArrayOf(
                      R.id.col_box_0, R.id.col_box_1, R.id.col_box_2, R.id.col_box_3, R.id.col_box_4
                  )
                  private val OPEN_IDS = intArrayOf(
                      R.id.col_open_0, R.id.col_open_1, R.id.col_open_2, R.id.col_open_3, R.id.col_open_4
                  )
                  private val TIME_IDS = intArrayOf(
                      R.id.tv_time_0, R.id.tv_time_1, R.id.tv_time_2, R.id.tv_time_3, R.id.tv_time_4
                  )
                  private val CHECK_IDS = intArrayOf(
                      R.id.iv_check_0, R.id.iv_check_1, R.id.iv_check_2, R.id.iv_check_3, R.id.iv_check_4
                  )

                  fun updateAllWidgets(context: Context) {
                      val manager = AppWidgetManager.getInstance(context)
                      val ids = manager.getAppWidgetIds(ComponentName(context, SholatWidget::class.java))
                      for (id in ids) {
                          updateSingleWidget(context, manager, id)
                      }
                  }

                  private fun updateSingleWidget(
                      context: Context,
                      manager: AppWidgetManager,
                      appWidgetId: Int
                  ) {
                      val views = RemoteViews(context.packageName, R.layout.widget_sholat)
                      val today = LocalDate.now()
                      val times = SholatPrefs.getScheduleForDate(context, today)
                      val activeIndex = SholatPrefs.getActivePrayerIndex(times)

                      val openAppIntent = Intent(context, MainActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                      }
                      val openAppPending = PendingIntent.getActivity(
                          context,
                          100,
                          openAppIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      views.setOnClickPendingIntent(R.id.widget_root, openAppPending)

                      for (i in 0..4) {
                          views.setTextViewText(TIME_IDS[i], times[i])
                          val done = SholatPrefs.isPrayerDone(context, today, i)
                          views.setImageViewResource(
                              CHECK_IDS[i],
                              if (done) R.drawable.ic_check_on else R.drawable.ic_check_off
                          )
                          views.setInt(
                              BOX_IDS[i],
                              "setBackgroundResource",
                              if (i == activeIndex) R.drawable.bg_pill_active else R.drawable.bg_pill_normal
                          )

                          views.setOnClickPendingIntent(OPEN_IDS[i], openAppPending)

                          val toggleIntent = Intent(context, SholatWidget::class.java).apply {
                              action = ACTION_TOGGLE_PRAYER
                              putExtra(EXTRA_PRAYER_INDEX, i)
                          }
                          val togglePending = PendingIntent.getBroadcast(
                              context,
                              200 + i,
                              toggleIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                          )
                          views.setOnClickPendingIntent(CHECK_IDS[i], togglePending)
                      }

                      manager.updateAppWidget(appWidgetId, views)
                  }
              }
          }
