                  val (doneCount, totalCount) = SholatPrefs.getMonthProgress(this, displayedMonth)
                  val pct = if (totalCount > 0) (doneCount * 100) / totalCount else 0
                  tvMonthPercent.text = "$pct% ($doneCount/$totalCount)"

                  renderSelectedDateEditor()
                  renderCalendarGrid()
                  SholatWidget.updateAllWidgets(this)
              }

              private fun renderSelectedDateEditor() {
                  val today = LocalDate.now()
                  val fmt = DateTimeFormatter.ofPattern("EEEE, d MMM yyyy", indoLocale)
                  val labelSuffix = when (selectedDate) {
                      today -> " (Hari Ini)"
                      today.minusDays(1) -> " (Kemarin)"
                      else -> ""
                  }
                  tvSelectedDateTitle.text = "Status Sholat: ${selectedDate.format(fmt)}$labelSuffix"

                  layoutDayEditorRow.removeAllViews()
                  val times = SholatPrefs.getScheduleForDate(this, selectedDate)
                  val statuses = SholatPrefs.getDayStatuses(this, selectedDate)

                  for (i in 0..4) {
                      val col = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          gravity = Gravity.CENTER
                          setPadding(dp(2), dp(8), dp(2), dp(8))
                          layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply {
                              marginStart = dp(2)
                              marginEnd = dp(2)
                          }
                          background = if (statuses[i]) {
                              makeCardBg("#1F81C995", "#6681C995", 14)
                          } else {
                              makeCardBg("#14FFFFFF", "#1FFFFFFF", 14)
                          }
                          setOnClickListener {
                              SholatPrefs.togglePrayer(this@MainActivity, selectedDate, i)
                              refreshAllUI()
                          }
                      }

                      val tvName = TextView(this).apply {
                          text = SholatPrefs.PRAYER_NAMES[i]
                          setTextColor(Color.parseColor("#C4C6D0"))
                          textSize = 11f
                      }
                      val tvTime = TextView(this).apply {
                          text = times[i]
                          setTextColor(Color.parseColor("#E2E2E6"))
                          textSize = 12f
                          setTypeface(typeface, Typeface.BOLD)
                          setPadding(0, dp(2), 0, dp(6))
                      }
                      val ivCheck = ImageView(this).apply {
                          setImageResource(if (statuses[i]) R.drawable.ic_check_on else R.drawable.ic_check_off)
                          layoutParams = LinearLayout.LayoutParams(dp(26), dp(26))
                      }

                      col.addView(tvName)
                      col.addView(tvTime)
                      col.addView(ivCheck)
                      layoutDayEditorRow.addView(col)
                  }
              }

              private fun renderCalendarGrid() {
                  val monthFmt = DateTimeFormatter.ofPattern("MMMM yyyy", indoLocale)
                  tvMonthTitle.text = displayedMonth.atDay(1).format(monthFmt).replaceFirstChar { it.uppercase() }

                  calendarGrid.removeAllViews()

                  val firstDayOfMonth = displayedMonth.atDay(1)
                  val leadingEmpty = firstDayOfMonth.dayOfWeek.value - 1 // Monday = 0
                  val daysInMonth = displayedMonth.lengthOfMonth()
                  val today = LocalDate.now()

                  val totalCells = ((leadingEmpty + daysInMonth + 6) / 7) * 7

                  for (cellIndex in 0 until totalCells) {
                      val dayNum = cellIndex - leadingEmpty + 1
                      val cellLayout = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          gravity = Gravity.CENTER
                          setPadding(dp(2), dp(6), dp(2), dp(6))
                          layoutParams = GridLayout.LayoutParams().apply {
                              width = 0
                              height = GridLayout.LayoutParams.WRAP_CONTENT
                              columnSpec = GridLayout.spec(cellIndex % 7, 1f)
                              setMargins(dp(2), dp(3), dp(2), dp(3))
                          }
                      }

                      if (dayNum in 1..daysInMonth) {
                          val date = displayedMonth.atDay(dayNum)
                          val isSelected = date == selectedDate
                          val isToday = date == today

                          cellLayout.background = when {
                              isSelected -> makeCardBg("#2EA8C7FA", "#A8C7FA", 12)
                              isToday -> makeCardBg("#1AFFFFFF", "#55FFFFFF", 12)
                              else -> makeCardBg("#00000000", "#00000000", 12)
                          }

                          val tvDay = TextView(this).apply {
                              text = dayNum.toString()
                              textSize = 13f
                              setTypeface(typeface, if (isToday || isSelected) Typeface.BOLD else Typeface.NORMAL)
                              setTextColor(
                                  when {
                                      date.isAfter(today) -> Color.parseColor("#55E2E2E6")
                                      isSelected -> Color.parseColor("#A8C7FA")
                                      else -> Color.parseColor("#E2E2E6")
                                  }
                              )
                          }
                          cellLayout.addView(tvDay)

                          // 5 Dots Indicator (Subuh - Isya)
                          val dotsRow = LinearLayout(this).apply {
                              orientation = LinearLayout.HORIZONTAL
                              gravity = Gravity.CENTER
                              setPadding(0, dp(4), 0, 0)
                          }
                          val statuses = SholatPrefs.getDayStatuses(this, date)
                          for (i in 0..4) {
                              val dot = View(this).apply {
                                  val size = dp(5)
                                  layoutParams = LinearLayout.LayoutParams(size, size).apply {
                                      setMargins(dp(1), 0, dp(1), 0)
                                  }
                                  background = GradientDrawable().apply {
                                      shape = GradientDrawable.OVAL
                                      setColor(
                                          if (statuses[i]) Color.parseColor("#81C995")
                                          else Color.parseColor("#2EFFFFFF")
                                      )
                                  }
                              }
                              dotsRow.addView(dot)
                          }
                          cellLayout.addView(dotsRow)

                          cellLayout.setOnClickListener {
                              selectedDate = date
                              refreshAllUI()
                          }
                      }

                      calendarGrid.addView(cellLayout)
                  }
              }

              private fun ensureMonthSchedule(ym: YearMonth) {
                  if (!SholatPrefs.hasScheduleForMonth(this, ym)) {
                      thread {
                          if (SholatPrefs.syncKemenagSchedule(this, null, ym)) {
                              runOnUiThread { refreshAllUI() }
                          }
                      }
                  }
              }

              private fun checkLocationAndSync(forceToast: Boolean) {
                  val fine = ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION)
                  val coarse = ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_COARSE_LOCATION)
                  if (fine != PackageManager.PERMISSION_GRANTED && coarse != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(
                          this,
                          arrayOf(Manifest.permission.ACCESS_COARSE_LOCATION, Manifest.permission.ACCESS_FINE_LOCATION),
                          101
                      )
                  } else {
                      fetchGpsAndSyncKemenag(forceToast)
                  }
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 101) {
                      fetchGpsAndSyncKemenag(true)
                  }
              }

              @Suppress("MissingPermission")
              private fun fetchGpsAndSyncKemenag(showFeedback: Boolean) {
                  if (showFeedback) {
                      Toast.makeText(this, "Menyelaraskan lokasi GPS & jadwal Kemenag...", Toast.LENGTH_SHORT).show()
                  }
                  thread {
                      var detectedCity: String? = null
                      try {
                          val lm = getSystemService(Context.LOCATION_SERVICE) as LocationManager
                          val loc = lm.getLastKnownLocation(LocationManager.NETWORK_PROVIDER)
                              ?: lm.getLastKnownLocation(LocationManager.GPS_PROVIDER)
                          if (loc != null) {
                              val geocoder = Geocoder(this, indoLocale)
                              val addresses = geocoder.getFromLocation(loc.latitude, loc.longitude, 1)
                              if (!addresses.isNullOrEmpty()) {
                                  val addr = addresses[0]
                                  detectedCity = addr.subAdminArea ?: addr.locality ?: addr.adminArea
                              }
                          }
                      } catch (_: Exception) {}

                      val ok = SholatPrefs.syncKemenagSchedule(this, detectedCity, displayedMonth)
                      runOnUiThread {
                          refreshAllUI()
                          if (showFeedback) {
                              val msg = if (ok) "Jadwal Kemenag (${SholatPrefs.getCityName(this)}) diperbarui!"
                              else "Menggunakan jadwal tersimpan (${SholatPrefs.getCityName(this)})"
                              Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
              }
          }
