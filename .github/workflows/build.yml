      - name: Compile Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare Release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk sholat-tracker-widget.apk

      - name: Upload APK to Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sholat-tracker-widget
          path: sholat-tracker-widget.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Sholat Tracker Widget v1.0.${{ github.run_number }}"
          files: sholat-tracker-widget.apk
          make_latest: true
